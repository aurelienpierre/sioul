# The projects' file, an example (docs/notes-folder.md).
# Yours is sioul-projects.toml among Sioul's own lists: records/ in its data
# folder (at the root of the notes folder before your lists moved).
# The record of each project stays in your own Markdown files; Sioul links to them.
# (Its first name, sioul-cases.toml with [[case]] entries, still reads.)

[[project]]
id = "taxes-2025"
title = "Income tax 2025"
files = ["admin/taxes-2025.md"]
status = "open"
# Mail from the tax office: the domain and all its subdomains.
[[project.route]]
from_domains = ["impots.example"]

[[project]]
id = "health-cover"
title = "Health cover request"
files = ["admin/health-cover.md", "admin/outbox.md"]
status = "waiting"
[[project.route]]
from_domains = ["health-insurer.example"]
# A route can also need several things at once: here, this sender AND these words.
[[project.route]]
from_domains = ["hospital.example"]
subject_contains = ["certificate", "attestation"]

[[project]]
id = "gift-cards"
title = "Gift cards"
area = "work"
# Each sale the shop tells of makes a task, once (docs/notes-folder.md, "Routes that make tasks").
[[project.route]]
from_addresses = ["shop@example.org"]
subject_contains = ["New sale"]
makes = "send-a-gift-card"
# The model of those tasks: in the list "Work", asked for 3 business days after
# the mail came, 15 minutes, each planning a stamp, an envelope and a card.
[[project.model]]
id = "send-a-gift-card"
name = "Send a gift card"
list = "nextcloud/work"
prefix = "Send:"
business_days = 3
estimate = 15
supplies = [{ id = "stamps", quantity = 1 }, { id = "envelopes", quantity = 1 }, { id = "cards", quantity = 1 }]
