# A virtual OpenPGP card, through the system's smart card service: the one
# part of Sioul's security keys no other test reaches (docs/client.md, "Your
# keys on a security key"; TODO §4, 10 November 2026).
#
# opcard-rs, Nitrokey's OpenPGP card firmware, runs on the runner as a
# virtual card (its `vpicc` example), in vsmartcard's virtual reader (vpcd)
# of pcsc-lite; `oct` (openpgp-card-tools) makes its keys on it, with their
# certificate. Then sioul-sync's ignored test reads the card through PC/SC as
# Sioul reads a key, checks the certificate against it, signs and encrypts a
# message at Send with its PIN, and opens it with the card
# (`send::tests::a_virtual_card_through_the_system_s_smart_card_service`).
# Never a real key: the test does nothing unless CI says so and names the
# certificate, and checks that the virtual reader is the only one. pcscd
# runs without --auto-exit for the whole job, every build done before the
# card starts (review of wt/mail, F1).
#
# Runs on each push to main that touches the security keys or the mail's
# protection, and by hand. Linux alone: vsmartcard's reader is a pcsc-lite
# driver. Versions checked on 10 November 2026: opcard-rs v1.11.0,
# openpgp-card-tools 0.11.13, vsmartcard-vpcd 3.3 (Ubuntu 24.04's),
# actions/checkout v7.0.1, Swatinem/rust-cache v2.9.2.

name: A virtual OpenPGP card

on:
  push:
    branches: [main]
    paths:
      - "crates/sioul-sync/src/securitykey/**"
      - "crates/sioul-sync/src/securitykey.rs"
      - "crates/sioul-sync/src/send.rs"
      - "crates/sioul-core/src/securitykey.rs"
      - "crates/sioul-core/src/pgp.rs"
      - "crates/sioul-core/src/compose.rs"
      - "Cargo.lock"
      - ".github/workflows/virtual-card.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-card:
    name: opcard-rs through vsmartcard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: virtual-card
          cache-on-failure: true

      # pcsc-lite's service and its client library, vsmartcard's virtual
      # reader (a pcsc-lite driver, listening on localhost:35963), D-Bus for
      # sioul-sync's notifications, netcat to see the reader listen.
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libpcsclite-dev pcscd vsmartcard-vpcd netcat-openbsd

      # Everything built before the card starts: the builds take minutes, and
      # nothing may wait on the card meanwhile.
      - name: opcard-rs, oct, and the test
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/Nitrokey/opcard-rs "$RUNNER_TEMP/opcard-rs"
          cargo build --release --example vpicc --manifest-path "$RUNNER_TEMP/opcard-rs/Cargo.toml"
          cargo install --locked openpgp-card-tools@0.11.13
          cargo test --release --locked -p sioul-sync --lib --no-run

      # Ubuntu's pcscd quits 60 seconds after its last client (--auto-exit),
      # and vpcd's reader with it: run without, for the whole job. The card
      # starts once vpcd listens; its PINs are the specification's defaults
      # (123456, and 12345678 to administer it).
      - name: The smart card service, the virtual card, its keys and their certificate
        run: |
          sudo systemctl stop pcscd.socket pcscd.service || true
          sudo sh -c 'pcscd --foreground > /tmp/pcscd.log 2>&1 &'
          for i in $(seq 30); do nc -z 127.0.0.1 35963 && break; sleep 1; done
          nc -z 127.0.0.1 35963
          "$RUNNER_TEMP/opcard-rs/target/release/examples/vpicc" > "$RUNNER_TEMP/vpicc.log" 2>&1 &
          ident=
          for i in $(seq 30); do
            ident=$(oct list --idents-only 2>/dev/null | grep -E '^[0-9A-F]{4}:[0-9A-F]{8}$' | head -n 1 || true)
            [ -n "$ident" ] && break
            sleep 1
          done
          test -n "$ident"
          echo "The card: $ident"
          printf '123456' > "$RUNNER_TEMP/user.pin"
          printf '12345678' > "$RUNNER_TEMP/admin.pin"
          oct admin --card "$ident" --admin-pin "$RUNNER_TEMP/admin.pin" generate --user-pin "$RUNNER_TEMP/user.pin" --output "$RUNNER_TEMP/card.asc" --userid "Card Holder <card@example.org>" curve25519
          oct status --card "$ident"

      - name: Folders for the tests
        run: |
          for folder in config data state cache; do
            mkdir -p "$RUNNER_TEMP/xdg/$folder" && echo "A folder made for Sioul's tests." > "$RUNNER_TEMP/xdg/$folder/.sioul-stand-in"
          done

      - name: Sioul and the virtual card
        env:
          SIOUL_VIRTUAL_CARD: ${{ runner.temp }}/card.asc
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: cargo test --release --locked -p sioul-sync --lib -- --ignored --exact send::tests::a_virtual_card_through_the_system_s_smart_card_service --nocapture

      - name: The card's and the service's logs, when something failed
        if: failure()
        run: |
          cat "$RUNNER_TEMP/vpicc.log" || true
          cat /tmp/pcscd.log || true
