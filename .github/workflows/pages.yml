# Publishes Sioul's website on GitHub Pages: the user guide (website/), the
# design notes (docs/) and the API reference made from the code's comments
# (rustdoc, javadoc, tools/qml-docs.py), built by website/build.sh, as on your
# own computer: the guide and the notes first (--strict), then the API
# reference (--strict --api-only). The reference can fail without holding
# back the guide: the site is then published without it, and the run says so.
#
# Runs on each push to main that changes the website, the notes, the code or
# this workflow, and by hand (Actions, "Publish the website", "Run workflow").
# Once, in the repository's settings: Pages, Build and deployment, Source:
# GitHub Actions.
#
# The actions are those build.yml and android.yml use, at the same versions.

name: Publish the website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      # The code the API reference is made from.
      - "crates/**"
      - "android/package/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/qml-docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; one that started is let finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # The system build.yml builds the window on: its Qt and its packages are known to work there.
    runs-on: ubuntu-24.04
    # A first run builds every crate the docs need (a few cached ones after);
    # the API reference's own steps have their own limits, within this one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Zensical
        run: pip install zensical==0.0.67

      # The guide and the notes first. The same script as on your computer:
      # it copies the design notes of docs/ into website/docs/dev/, writes the
      # QML page, then builds; --strict stops at a broken link, so that a
      # broken page is never published.
      - name: The design notes, then the site
        run: bash website/build.sh --strict

      # Then the API reference. Each of its steps may fail (continue-on-error)
      # without holding back the guide: a download that fails (Qt, Android's
      # platform) or a warning of rustdoc or javadoc leaves the site as built
      # above, and the last of these steps says so on the run's page.

      # Rust, for rustdoc (cargo doc).
      - uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      # What the crates need to be documented, as to be built (build.yml):
      # D-Bus for the keyring and notifications (pkg-config, libdbus-1-dev),
      # pcsc-lite's client for security keys (libpcsclite-dev, which pcsc-sys's
      # build script finds even for rustdoc), the Vulkan and xkbcommon headers
      # Qt's own include, lld for CXX-Qt.
      - name: Linux packages
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev libpcsclite-dev libvulkan-dev libxkbcommon-dev lld

      # The window's crate builds its QML module and its C++ even to be
      # documented (its build script): Qt as build.yml installs it, with the
      # same modules and the same pinned aqtinstall, so both share the cache.
      - name: Qt
        continue-on-error: true
        timeout-minutes: 20
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          modules: qtwebengine qtwebchannel qtpositioning qtmultimedia qtlocation qtpdf qtimageformats
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      # CXX-Qt looks for qmake6, then qmake, on PATH; this names the one just installed.
      - name: Tell CXX-Qt which Qt
        continue-on-error: true
        run: echo "QMAKE=${QT_ROOT_DIR}/bin/qmake" >> "$GITHUB_ENV"

      # The crates' dependencies, checked once and kept between runs.
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: api
          cache-on-failure: true

      # javadoc, for the Android code (as android.yml installs Java).
      - uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "21"

      # Android's classes (android.jar), so that javadoc knows them and links
      # them to Android's reference; the runner's SDK may lack this platform.
      - name: Android platform, for javadoc
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
          fi

      # rustdoc and javadoc, then their pages copied into the site built
      # above, only once both are made; with --strict, a warning of either
      # is a failure, so that a broken page is never published.
      - name: The API reference, into the site
        id: api
        continue-on-error: true
        timeout-minutes: 50
        run: bash website/build.sh --strict --api-only

      - name: Say that the API reference is missing
        if: steps.api.outcome != 'success'
        run: echo "::warning title=API reference not published::The user guide and the notes are published without the API reference (api/rust/, api/java/); the failed steps above say why. The next run that builds it publishes it again."

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
