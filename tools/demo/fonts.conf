<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SPDX-License-Identifier: GPL-3.0-or-later
  Copyright © 2026 Aurélien Pierre

  The fonts of the demo's pictures (screenshots.sh, run.sh: FONTCONFIG_FILE):
  those Plasma users see, Noto Sans and Hack, whatever this system's default.
  Bitstream Vera Sans, for one, draws the no-break space of "620 €" twice as
  wide as a space. The system's configuration, then these first.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Sans Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hack</string></edit>
  </match>
</fontconfig>
