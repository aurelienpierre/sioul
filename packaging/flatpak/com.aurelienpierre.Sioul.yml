# Flatpak for Linux, built by .github/workflows/release.yml into the bundle
# published with each release. The antivirus is the system's ClamAV, which a
# Flatpak does not reach: attachments are opened after Sioul asks, saying
# they will not be checked (docs/client.md, "Antivirus").
#
# Qt 6.9 at least (docs/building.md): the KDE runtime carries Qt Location,
# Positioning, Multimedia and WebChannel; Qt WebEngine (and Qt PDF) come from
# its BaseApp, in /app, which qt-both.sh shows CXX-Qt beside the runtime's Qt.
# The crates are fetched during the build (network allowed to this module):
# for Flathub, they would be listed beforehand instead (flatpak-cargo-generator).
#
# By hand: flatpak-builder --user --install --install-deps-from=flathub build packaging/flatpak/com.aurelienpierre.Sioul.yml

app-id: com.aurelienpierre.Sioul
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sioul-app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Sounds to rest by, voice memos, and calls' sound. PipeWire carries them:
  # Qt Multimedia speaks to it directly through its socket, else through
  # its PulseAudio side, which is Flatpak's own permission for sound.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # Security keys (YubiKey…) in sites are /dev/hidraw*: only "all" reaches them
  # (--device=usb and input do not); it also covers the GPU (dri).
  - --device=all
  # Your OpenPGP keys on a security key: the system's smart card service
  # (pcscd), whose socket this binds into the sandbox; pcscd owns the reader,
  # so --device=all does not reach it. pcsc-lite's client, which the runtime
  # lacks, is built in (the module pcsc-lite, below).
  - --socket=pcsc
  # The system keyring (Secret Service) and notifications.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # colour: colord, read only, to tell which screen a colour profile belongs
  # to when there are several (docs/colour.md).
  - --system-talk-name=org.freedesktop.ColorManager
  # Your case files and budgets, where you keep them.
  - --filesystem=home
  # Qt WebEngine's helper and QML modules, from its BaseApp.
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QML_IMPORT_PATH=/app/lib/qml:/app/qml
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # pcsc-lite's client, which the KDE runtime does not carry: built from its
  # source, the client alone, and linked into the programs, as the AppImage
  # does (its 2.5 client speaks the daemon's protocols 4.4 to 4.6). The static
  # library is only needed to build, and leaves the package.
  - name: pcsc-lite
    buildsystem: simple
    build-commands:
      - meson setup build --default-library=static -Dlibsystemd=false -Dlibudev=false -Dpolkit=false -Dusb=false -Dserial=false
      - meson compile -C build pcsclite
      - install -Dm644 build/libpcsclite.a /app/lib/libpcsclite.a
      - install -Dm644 COPYING /app/share/licenses/pcsc-lite/COPYING
    cleanup:
      - /lib/libpcsclite.a
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.2.tar.xz
        sha256: 60a08942d8c00a1d86a3bf4c64eddbf7a5569c7c54f6904e3f07801bb5316acd
  - name: sioul
    buildsystem: simple
    build-options:
      # The crates come from crates.io during the build.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/sioul/cargo
        CARGO_INCREMENTAL: '0'
        QMAKE: /run/build/sioul/qmake-both
        # pcsc-sys links the client built above (static=pcsclite).
        PCSC_LIB_DIR: /app/lib
        PCSC_LIB_NAME: static=pcsclite
    build-commands:
      - sh packaging/flatpak/qt-both.sh
      - cargo build --release --locked -p sioul-app -p sioul-cli
      - install -Dm755 target/release/sioul-app /app/bin/sioul-app
      - install -Dm755 target/release/sioul /app/bin/sioul
      # The desktop file, the icon and the AppStream file, all under the application's id.
      - install -Dm644 data/com.aurelienpierre.Sioul.desktop /app/share/applications/com.aurelienpierre.Sioul.desktop
      - install -Dm644 data/com.aurelienpierre.Sioul.metainfo.xml /app/share/metainfo/com.aurelienpierre.Sioul.metainfo.xml
      - mkdir -p /app/share/icons && cp -r data/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - website/site
          - website/.cache
          - .flatpak-builder
