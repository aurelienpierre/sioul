# Words Sioul looks for in Italian (docs/words.md): the lists whose wording is public and stable.
# Read folded: capitals and accents do not matter. Whole words, except where a list says otherwise.
# Letters, papers, bank exports and payments in Italian wait for real examples: a guessed legal phrase does more harm than none.
# Your own changes go in config.toml under [words], never here: a newer Sioul's words still reach you.

language = "it"
checked = "2026-10-08"


# One-time codes, passwords, password resets, sign-in links and addresses to confirm (codes.rs).
[codes]
# Names a code: a code right beside it is taken.
code = [
    "codice di verifica", "codice di sicurezza", "codice di conferma", "codice di accesso", "codice di autenticazione",
    "codice di attivazione", "codice monouso", "password monouso", "codice otp", "codice di convalida",
]
# Points at a code without naming it: counts only in a message about signing in.
pointing = ["il seguente codice", "questo codice", "inserisci il codice", "usa il codice", "copia il codice"]
# Says the message is about signing in or checking who you are, somewhere in it.
sign_in = ["accedi", "accesso", "accedere", "login", "registrazione", "verifica", "verificare", "conferma", "identità", "autenticazione"]
# Words between "your" and "code" that make it no secret of yours.
not_yours = [
    "postale", "promozionale", "sconto", "coupon", "regalo", "ordine", "cliente", "tracking", "prenotazione", "fiscale",
    "wifi", "iban", "swift", "bic",
]
# A shop's code: the message hands over no secret.
promo = ["sconto", "coupon", "promozione", "codice promozionale", "codice sconto", "% di sconto"]
# Hands a password over.
password = ["password temporanea", "password provvisoria", "la tua password è", "la tua nuova password è"]
# A password reset.
reset = [
    "reimposta la password", "reimpostare la password", "reimpostazione della password", "password dimenticata",
    "crea una nuova password", "imposta una nuova password",
]
# A link that signs you in.
link = ["link di accesso", "link magico", "accedi con questo link"]
# What a sign-in link's message is about, in its subject or first lines.
intents = ["accedi", "accesso", "accedere", "login"]
# What may be said to expire or to work once: the link, its button, the code.
link_words = ["link", "pulsante", "codice", "collegamento"]
# Says something expires or is valid.
validity = ["scade", "scadrà", "scaduto", "valido", "scadenza"]
# Lines that answer a request of yours; a newsletter does not write them.
request = [
    "se non hai richiesto", "se non sei stato tu", "se non è stato lei", "se non ha richiesto", "puoi ignorare questa email",
    "puoi ignorare questo messaggio", "ignora questo messaggio", "ignori questo messaggio",
]
# An address or an account to confirm.
confirm = [
    "conferma il tuo indirizzo email", "conferma la tua email", "verifica la tua email", "verifica il tuo indirizzo email",
    "attiva il tuo account", "conferma il tuo account", "conferma la registrazione",
]
# Grammar: hands a code over, the code right after.
giving = ["il tuo codice", "il suo codice"]
# Grammar: whose code, a few words before "code".
owners = ["tuo", "suo", "vostro"]
# Grammar: says a code is yours, right after it ("123456 è il tuo codice").
owned_after = ["è il tuo", "è il suo"]
# Grammar: may stand between a phrase and its code.
linking = ["è"]
# A link or a code that works once.
once = ["una sola volta", "solo una volta", "monouso"]
# Words before a validity ("valido per 10 minuti").
expiry_context = ["valido", "scade", "entro"]
# The word for a code itself.
noun = ["codice"]
# Starts of a unit of minutes, after a number.
unit_minutes = ["min"]
# Starts of a unit of hours, after a number ("ora", "ore").
unit_hours = ["ora", "ore"]
# Starts of a unit of days, after a number.
unit_days = ["giorn"]

# Other apps' notifications that hand a code over or ask for an approval now (appnotes.rs): never held.
[approvals]
# Asks you to approve a sign-in, a payment or an operation now.
phrases = [
    "approva l'accesso", "conferma l'accesso", "autorizza l'accesso", "autorizza il pagamento", "conferma il pagamento",
    "approva il pagamento", "conferma l'operazione", "autorizza l'operazione", "tentativo di accesso", "nuovo accesso",
]
# "Is this you?": counts only beside what it is about (`asked_about`).
asks = ["sei tu", "eri tu", "è lei", "era lei"]
# What such a question is about.
asked_about = ["accesso", "login", "nuovo dispositivo", "pagamento", "acquisto", "operazione", "account"]
# Words in the name of a notification channel for codes or sign-ins.
channels = ["sicurezza", "verifica", "accesso", "autenticazione"]

# Automatic senders (porch.rs): an address holding one of these is filed.
[senders]
automatic = ["non-rispondere", "nonrispondere", "no-risposta"]

# Prefixes of a subject already answered or forwarded (compose.rs).
[replies]
forward = ["i:", "inoltro:", "fw:"]
reply = ["r:", "ris:"]

# A message's quoted history (reading.rs): lines that open it, its header names, its attribution.
[quotes]
# Lines that open a forwarded or answered message, before its headers.
openings = ["---------- messaggio inoltrato ---------", "-----messaggio originale-----", "inizio messaggio inoltrato:"]
# Header names of a quoted message.
header_names = ["da", "inviato", "a", "oggetto", "data", "cc", "rispondi a"]
# The first header of a quoted block.
from_names = ["da"]
# One of these makes a block of headers a quoted message.
enough_names = ["oggetto", "data", "inviato"]
# Endings of an attribution line.
wrote = ["ha scritto:"]
# Starts of an attribution line broken over two lines.
attribution_starts = ["Il"]

# Mail folders by their names, when the server does not say what each is for (folders.rs).
[folders]
sent = ["posta inviata", "inviata", "elementi inviati", "inviati"]
drafts = ["bozze", "bozza"]
junk = ["posta indesiderata", "indesiderata"]
trash = ["cestino", "posta eliminata", "elementi eliminati"]
archive = ["archivio"]

# Quick capture: one typed line makes a task (capture.rs).
[capture]
today = ["oggi"]
tomorrow = ["domani"]
next_week = ["prossima settimana", "la prossima settimana", "settimana prossima"]
in = ["tra", "fra"]
unit_days = ["giorno", "giorni"]
unit_weeks = ["settimana", "settimane"]
# Ordinal suffixes of a day ("1º").
ordinals = ["º"]

# Day names.
[capture.weekdays]
monday = ["lunedì"]
tuesday = ["martedì"]
wednesday = ["mercoledì"]
thursday = ["giovedì"]
friday = ["venerdì"]
saturday = ["sabato"]
sunday = ["domenica"]

# Month names, by month number.
[capture.months]
1 = ["gennaio", "gen"]
2 = ["febbraio", "feb"]
3 = ["marzo", "mar"]
4 = ["aprile", "apr"]
5 = ["maggio", "mag"]
6 = ["giugno", "giu"]
7 = ["luglio", "lug"]
8 = ["agosto", "ago"]
9 = ["settembre", "set"]
10 = ["ottobre", "ott"]
11 = ["novembre", "nov"]
12 = ["dicembre", "dic"]

# The spam filter's tokenizer (spam/tokenize.rs). A table keeps the words it was trained with: a change here counts from the next training.
[spam]
# Month names in dates, which become _DATE_.
months = [
    "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre",
    "dicembre", "gen", "mag", "giu", "lug", "ago", "set", "ott", "dic",
]

# Reading scans (sioul-sync's ocr.rs).
[ocr]
# Tesseract's names of this language's models.
tesseract = ["ita"]
