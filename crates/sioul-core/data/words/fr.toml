    "dec", "fev", "avr", "mai", "jui", "aou", "janvier", "fevrier", "mars", "avril", "juin", "juillet", "aout",
    "septembre", "octobre", "novembre", "decembre",
]
# Key names in keyboard shortcuts, which become _SHORTCUT_.
