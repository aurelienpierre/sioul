# Words Sioul looks for in French (docs/words.md): a list for each thing it recognises.
# Read folded: capitals and accents do not matter. Whole words, except where a list says otherwise.
# Your own changes go in config.toml under [words], never here: a newer Sioul's words still reach you.

language = "fr"
checked = "2026-10-09"


# One-time codes, passwords, password resets, sign-in links and addresses to confirm (codes.rs).
[codes]
# Names a code: a code right beside it is taken.
code = [
    "verification code", "confirmation code", "authentication code", "login code", "passcode", "otp", "validation code",
    "activation code", "2fa", "verification pin", "code de verification", "code de securite", "code de confirmation",
    "code d'authentification", "code d'acces", "code de connexion", "code d'activation", "code a usage unique",
    "mot de passe a usage unique", "code temporaire", "code de validation", "code d'identification",
    "double authentification", "authentification a deux facteurs",
]
# Points at a code without naming it ("enter the code below"): counts only in a message about signing in.
pointing = [
    "code suivant", "ce code", "code ci-dessous", "code ci dessous", "saisissez le code", "entrez le code",
    "utilisez le code", "indiquez le code", "renseignez le code", "copiez le code",
]
# Says the message is about signing in or checking who you are, somewhere in it.
sign_in = [
    "login", "verification", "authentication", "connexion", "connecter", "connectez", "identifier", "identification",
    "verifier", "confirmer", "identite", "authentifier", "authentification", "inscription",
]
# Words between "your" and "code" that make it no secret of yours ("your zip code").
not_yours = [
    "promo", "coupon", "gift", "voucher", "client", "swift", "bic", "iban", "wifi", "wi-fi", "promotionnel", "cadeau",
    "avantage", "reduction", "parrainage", "suivi", "colis", "commande", "adherent", "membre", "produit", "article",
    "erreur", "vestimentaire", "porte", "portail", "immeuble", "casier", "banque", "guichet", "naf", "ape", "insee",
    "fiscal", "tva", "pays", "region", "departement", "commune",
]
# A shop's code: the message hands over no secret.
promo = ["promo", "coupon", "voucher", "gift code", "reduction", "bon d'achat", "code avantage", "code cadeau"]
# Hands a password over.
password = [
    "mot de passe provisoire", "mot de passe temporaire", "votre mot de passe est", "votre nouveau mot de passe est",
    "votre nouveau mot de passe :", "votre nouveau mot de passe:", "voici votre mot de passe",
    "voici votre nouveau mot de passe", "mot de passe initial", "voici vos identifiants", "vos identifiants sont",
    "vos identifiants :", "vos identifiants:", "vos identifiants de connexion sont", "vos identifiants de connexion :",
]
# A password reset.
reset = [
    "reinitialiser votre mot de passe", "reinitialisation de votre mot de passe", "reinitialisation du mot de passe",
    "mot de passe oublie", "lien de reinitialisation", "definir votre mot de passe", "definissez votre mot de passe",
    "choisir un nouveau mot de passe", "choisissez un nouveau mot de passe", "creer votre mot de passe",
    "creez votre mot de passe",
]
# A link that signs you in.
link = [
    "lien de connexion", "lien magique", "se connecter avec ce lien", "cliquez pour vous connecter",
    "lien pour vous connecter", "lien pour se connecter", "confirmez votre connexion", "confirmer votre connexion",
    "validez votre connexion", "valider votre connexion",
]
# What a sign-in link's message is about, in its subject or first lines.
intents = ["login", "connexion", "vous connecter", "se connecter", "connectez-vous"]
# What may be said to expire or to work once: the link, its button, the code.
link_words = ["code", "lien", "bouton"]
# Says something expires or is valid.
validity = ["expire", "expiration", "valable", "valide", "expirera", "expirer"]
# Lines that answer a request of yours ("if you did not ask for this"); a newsletter does not write them.
request = [
    "si vous n'avez pas demande", "si vous n'etes pas a l'origine", "si ce n'est pas vous", "si vous n'avez pas essaye",
    "si vous n'avez pas fait cette demande", "ignorez ce message", "ignorer ce message", "ignorez cet e-mail",
    "ignorez cet email", "ignorer cet e-mail", "ignorer cet email", "ignorez ce mail", "changez-le", "modifiez-le",
    "a votre premiere connexion", "lors de votre premiere connexion", "des votre premiere connexion",
]
# An address or an account to confirm.
confirm = [
    "confirmez votre adresse", "confirmer votre adresse", "verifiez votre adresse", "confirmez votre e-mail",
    "confirmer votre e-mail", "confirmez votre email", "confirmer votre email", "verifiez votre e-mail",
    "verifier votre e-mail", "verifiez votre email", "verifier votre email", "verifier votre adresse",
    "validez votre adresse", "valider votre adresse", "activez votre compte", "activer votre compte",
    "confirmez votre compte", "confirmer votre compte", "confirmez votre inscription", "confirmer votre inscription",
]
# Grammar: hands a code over, the code right after ("your code: K7Q-2M9").
giving = ["votre code", "ton code"]
# Grammar: whose code, a few words before "code" ("your Instagram code").
owners = ["votre", "ton"]
# Grammar: says a code is yours, right after it ("123456 is your code").
owned_after = ["est votre", "est ton"]
# Grammar: may stand between a phrase and its code ("is").
linking = ["est"]
# A link or a code that works once.
once = ["une seule fois", "usage unique", "qu'une fois"]
# Words before a validity ("valid 10 minutes").
expiry_context = ["valable", "expire", "pendant", "dans"]
# The word for a code itself.
noun = ["code"]
# Starts of a unit of minutes, after a number.
unit_minutes = ["min"]
# Starts of a unit of hours, after a number.
unit_hours = ["heure"]
# Starts of a unit of days, after a number.
unit_days = ["jour"]

# Other apps' notifications that hand a code over or ask for an approval now (appnotes.rs): never held.
[approvals]
# Asks you to approve a sign-in, a payment or an operation now.
phrases = [
    "confirmez qu'il s'agit de vous", "confirmez votre identite", "demande de connexion", "tentative de connexion",
    "nouvelle connexion", "validez votre connexion", "valider votre connexion", "validez la connexion",
    "validez votre paiement", "valider votre paiement", "validez le paiement", "validez votre achat", "validez l'achat",
    "validez votre operation", "valider votre operation", "validez l'operation", "validez cette operation",
    "confirmez votre paiement", "confirmez le paiement", "confirmez votre operation", "confirmez l'operation",
    "authentifiez", "authentification forte", "authentification requise", "approuvez la connexion",
    "approuver la connexion", "approuvez le paiement",
]
# "Is this you?": counts only beside what it is about (`asked_about`).
asks = ["est-ce bien vous", "c'est bien vous", "est-ce vous", "c'etait vous"]
# What such a question is about.
asked_about = ["login", "transaction", "connexion", "connecter", "nouvel appareil", "paiement", "achat", "operation", "compte"]
# Words in the name of a notification channel for codes or sign-ins.
channels = [
    "otp", "2fa", "verification", "verification code", "authentication", "authentification", "login", "connexion",
    "connexions",
]

# Amounts in mail and letters (money.rs).
[money]
# Words after which the amount a message is about comes.
keywords = ["total", "montant", "vous avez recu", "paiement de", "versement de", "somme de", "a ete preleve", "prelevement de"]
# Sentences that state a payment; the amount follows them.
stated = [
    "vous avez recu un paiement de", "vous avez paye", "vous avez envoye", "paiement de", "montant de", "versement de",
    "virement de", "remboursement de",
]
# Labels of the line that holds what was paid.
totals = ["total", "montant total", "total ttc", "total paye", "montant paye", "montant debite"]
# Lines of a legal footer: their amounts (a share capital) are never a payment.
legal = ["capital", "siege social", "societe en commandite"]
# Labels of a subtotal, which is not the total.
subtotal = ["total partiel"]

# Mail about money: a payment made or received, a bill, an order, a refund (payments.rs).
[payments]
# Subjects about money that are not a payment.
not_payments = [
    "black friday", "paiement en plusieurs fois", "mandat", "expediee", "expedie", "a ete livree", "en cours de livraison",
]
# Money given back.
refund = ["remboursement", "vous a rembourse"]
# A payment you made.
paid = [
    "vous avez paye", "paiement effectue", "votre paiement a bien ete", "reglement de votre facture",
    "prelevement effectue", "a ete preleve", "avons preleve", "confirmation de paiement", "paiement accepte",
    "merci pour votre paiement", "abonnement a ete renouvele",
]
# Money that came in.
received = [
    "vous avez recu un paiement", "paiement recu", "vous avez recu un virement", "vous avez recu un don", "nouveau don",
    "virement recu",
]
# A merchant's order confirmation.
order = [
    "commande confirmee", "commande est validee", "commande validee", "confirmation de commande",
    "merci pour votre commande", "merci pour votre achat",
]
# A bill to pay.
bill = [
    "votre facture", "facture disponible", "nouvelle facture", "avis d'echeance", "montant a regler", "a regler avant",
    "a payer avant", "sera preleve", "prochain prelevement", "sera debite",
]
# The label above who was paid, in a receipt.
to = ["beneficiaire", "marchand", "vendeur"]
# The label above who paid, in a receipt.
from = ["envoye par"]
# Words before the party's name, after an amount ("de Jean").
leads = ["de la part de", "de", "à", "chez"]
# A subject naming an order…
order_words = ["commande"]
# …and saying it is confirmed.
confirmed_words = ["confirmee", "validee"]

# Bank and payment-processor exports (bank.rs).
[bank]
# Words that name nothing in a movement's label.
filler = [
    "via", "les", "des", "une", "pour", "par", "sur", "aux", "avec", "dans", "est", "pas", "que", "qui", "vos", "votre",
    "nos", "notre", "son", "ses", "leur", "chez", "sans", "entre", "prlv", "sepa", "vir", "virement", "prelevement",
    "paiement", "carte", "achat", "retrait", "debit", "credit", "ref", "reference",
]
# Statuses of rows left out: pending, refused, cancelled.
skipped = ["en attente", "refuse", "annule", "echoue"]
# A balance impact that says the row moves no money.
memo = ["memo"]

# A CSV export's columns, found by their names (a name starting with one of these; `name`, `net`, `kind`, `status`, `impact`, `balance`, `time`, `currency` and `id` are exact names).
[bank.columns]
date = ["date", "cree"]
label = ["libelle", "label", "description", "intitule", "detail", "operation", "nature"]
name = ["nom"]
net = ["net"]
amount = ["montant", "somme"]
debit = ["debit"]
credit = ["credit"]
kind = ["type"]
status = ["status", "etat", "statut"]
impact = ["impact sur le solde"]
balance = ["balance", "solde"]
time = ["heure"]
currency = ["devise"]
id = ["id", "transaction id", "numero de transaction", "id de transaction"]

# Lines above a CSV export's header: its balance, its day, its account.
[bank.above]
balance = ["solde"]
date = ["date"]
account = ["numero", "compte"]

# Money moved between your own accounts (accounts.rs).
[accounts]
# What a payment processor writes for money moved to or from a bank.
between = [
    "virement standard", "virement bancaire", "virement vers", "retrait", "approvisionnement", "transfert vers",
    "versement vers",
]

# Paper letters, read by OCR (letters.rs).
[letters]
# Sent registered…
registered = ["recommande", "lettre recommandee", "lrar"]
# …with an acknowledgment of receipt.
