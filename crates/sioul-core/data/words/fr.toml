# A line that asks for an amount.
asks = ["a payer", "a regler", "reste du", "montant du", "somme due", "montant total", "total a payer", "somme de", "montant de"]
# Ordinal suffixes of a day ("1er", "1st").
ordinals = ["er"]
# Words before a date by which something is asked.
deadline = ["avant le", "au plus tard le", "date limite", "echeance", "jusqu au", "payable avant"]
# Words before a delay ("dans un délai de deux mois").
delay_words = ["delai"]
# The word between a delay's word and its number.
delay_of = ["de"]
# Units of a delay.
unit_months = ["mois"]
unit_days = ["jours", "jour"]
unit_weeks = ["semaines", "semaine"]
# Says a delay counts from the letter's own date.
from_letter = ["date du present", "date de la presente"]
# The word before an appointment's time.
