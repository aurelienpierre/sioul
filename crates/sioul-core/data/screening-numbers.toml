# The numbers the call screening knows by their kind, from ARCEP's numbering
# plan and its open data (docs/android.md, "Calls"; research:
# docs/research/call-screening.md, 3.2 and 3.3; criteria CS12). Each group
# with its source and the day it was read: read them again before each
# release, and change `checked`. `cargo test -p sioul-core screening_numbers`
# checks that this file is well formed and that every group names its source.
#
# Prefixes are in national form ("0162"): the French plan's numbers are ten
# digits from 0, its overseas departments' included (+262, +590, +594, +596
# read as 0262…, 0590…, 0594…, 0596…; `screening::national`).
#
# kind:  automated     verified multi-use numbers (numéros polyvalents vérifiés):
#                      since 1 January 2023 the only ordinary numbers an automated
#                      system may show, for calls and texts alike, whatever it
#                      is for (canvassing, a parcel, an appointment, a bank)
#        never-shown   numbers the plan forbids as a caller ID
#        unattributed  blocks ARCEP had attributed to no operator on the day
#                      read: a number shown must come from an attributed block.
#                      ARCEP attributes about a thousand blocks a year, each one
#                      unattributed until then, so this group counts only for
#                      `valid_days` after `checked` (then only the plan's own
#                      rules stand); made by tools/screening-numbers.py from
#                      MAJNUM, whole blocks of 10,000 numbers or more
#
# Left out on purpose: the public-interest multi-use numbers (01510, 02810,
# 03410, 04410, 05410, 09410…, plan § 2.3.10 a), a category of their own that
# the screening treats as any number nobody knows (CS12), even where ARCEP
# has attributed no block of theirs yet (the generator leaves them out).

