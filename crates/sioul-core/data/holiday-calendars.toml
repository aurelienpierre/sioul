# The official calendars of holidays Sioul offers ready-made, country by
# country (Agenda ⚙ ▸ Your agendas ▸ Subscribe to a calendar…; docs/client.md,
# "Calendars by their address"; docs/areas.md, "Vacations and holidays").
#
# Only a state's own calendar, published under an open licence, is offered:
# files built from a commercial provider's data, without a licence, or mixing
# regional days and plain observances with the holidays, are not. A country
# without such a calendar has none here until one is found.
#
# `tools/check-holidays.py` asks every address before each release (each
# answers a calendar, holds whole days, and covers this year and the next);
# `cargo test -p sioul-core holiday_calendars` checks that this file is well
# formed, and that no id or address of before has changed.
#
# country:     ISO 3166-1, the country it is offered under ("FR", "GB")
# kind:        "public" (public holidays) or "school" (school holidays)
# id:          the subscription's id and its copy's folder, kept for good once
#              shipped: a calendar subscribed already is known by it
# name:        the territory's, the nation's or the zone's, as its publisher
#              writes it; shown after the kind ("Public holidays · Scotland")
# hint:        said under its name, when there is something to say (a zone's
#              académies); optional
# url:         its address (https)
# source:      who publishes it
# licence:     under which licence
# after_class: its holidays begin after class (the event's first day is still
#              a class day, its last the morning classes resume), as the
#              Ministry's files are shaped; optional, school holidays alone

# France: public holidays by territory (Etalab's files), school holidays by
# zone (the Ministry of Education's).

