# Starts by trade for clients' files (docs/clients.md, "Templates").
#
# A start writes its kinds of record and its folders into the person's own
# templates (`[clients]` of config.toml), in the window's language, where
# their ids are free; from then on they are the person's to change. A trade
# is data, never a type in the code. `proposes` lists the options that
# protect a start offers, each shown with its sentence, never set by it:
# keep-tied ("Keep from AI agents what is tied to a client"), stay-here
# ("Clients' files stay on this device"), keeping ("Keeping times and
# archiving by itself").
#
# Field types: line, text, number, amount, day, duration, choice, choices,
# yes-no, supply, attachment.

[start.beauty]
place = 1
name = { en = "Beauty care", fr = "Soins esthétiques" }
about = { en = "A treatment for each visit: the services, the products, how the skin reacted, the price. Folders for consents and pictures.", fr = "Un soin à chaque visite : les prestations, les produits, la réaction de la peau, le prix. Des dossiers pour les consentements et les photos." }
proposes = []

[start.beauty.folder.consents]
name = { en = "Consents", fr = "Consentements" }
place = 1

[start.beauty.folder.pictures]
name = { en = "Pictures", fr = "Photos" }
place = 2

[start.beauty.kind.treatment]
name = { en = "Treatment", fr = "Soin" }
appointments = true
default = true
line = "{services} · {price}"

[start.beauty.kind.treatment.field.services]
name = { en = "Services", fr = "Prestations" }
type = "line"
place = 1
shown = true

[start.beauty.kind.treatment.field.products]
name = { en = "Products", fr = "Produits" }
type = "text"
place = 2

[start.beauty.kind.treatment.field.skin]
name = { en = "How the skin reacted", fr = "Réaction de la peau" }
type = "text"
place = 3

[start.beauty.kind.treatment.field.price]
name = { en = "Price", fr = "Prix" }
type = "amount"
place = 4
shown = true

