[package]
name = "sioul-core"
description = "Sioul's core: reading mail, judging trust, routing to cases, admin windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mail-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
roxmltree.workspace = true
ammonia.workspace = true
pulldown-cmark.workspace = true
mail-builder.workspace = true
calcard.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
sequoia-openpgp.workspace = true
directories.workspace = true
jiff.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
# The spam filter's tokenizer (spam/tokenize.rs): both already built for every
# target, Android included (regex through sequoia-openpgp, icu_normalizer
# through sioul-sync), so nothing new is compiled.
regex = "1"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# DMARC's relaxed alignment by organisational domains (trust.rs): the Public
# Suffix List, compiled in (no file, no network), pure Rust and no_std, so the
# phone builds it too; MIT or Apache-2.0, released with each list update.
psl = "2"
# Texts (texts.rs): a message's fingerprint, each text once across phones.
# Already built for every target through sioul-sync (the same version):
# nothing new is compiled.
sha1 = "0.10"
sha2 = "0.10"
# Factur-X invoices (einvoice.rs): the XML a PDF carries, Flate-compressed.
# Already built for every target through sioul-sync (the same version and
# features): nothing new is compiled.
flate2 = "1"

# No core file of a crash (coredump.rs): setrlimit, on every Unix. Already
# built for every target through the other crates: nothing new is compiled.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A file's index and change time on Windows (filelock.rs, `identity`), which
# tell a file rewritten or put in place at the same size and time: in the lock
# already, through the standard library's own dependencies.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
fluent-syntax.workspace = true

[features]
# The tests of the crates built on this one (sioul-app's [dev-dependencies]
# turn it on): your addresses and the organizer's door set for one test's
# thread (`agenda::own_addresses_here`, `open_organizer_door_here`). Never
# enabled in Sioul's builds: `cargo tree -e features` shows it in test builds alone.
test-hooks = []
