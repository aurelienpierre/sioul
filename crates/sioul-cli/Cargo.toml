[package]
name = "sioul-cli"
description = "Sioul from the terminal: the Porch, cases, admin windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sioul"
path = "src/main.rs"

[dependencies]
sioul-core = { path = "../sioul-core" }
sioul-sync = { path = "../sioul-sync" }
clap.workspace = true
jiff.workspace = true
rpassword.workspace = true
# A passphrase, a code or a PIN typed to reopen what Sioul set aside, zeroed once used.
zeroize = "1"
serde.workspace = true
# The MCP server's JSON-RPC (`sioul mcp`); the core is built with it already.
serde_json.workspace = true
toml.workspace = true
# A client's records written out as a database (`sioul store export --clients`:
# records.sqlite, a table per kind of record), SQLite being the portable
# database every system and many programs open; SQLite's own C sources built
# in, so that no system library is needed. Here alone: no other crate gains it.
rusqlite = { version = "0.43", features = ["bundled"] }

# The spam filter's and the topics' training (`sioul spam`, `sioul topics`):
# every device trains its own (docs/spam-filter.md, "Every device trains its own").
sioul-learn = { path = "../sioul-learn" }

# A training runs below the other programs' priority (setpriority on every Unix,
# Linux's I/O class too), as the window's does.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# No test reaches a keyring (review of 19 October 2026, F11): resolver 3 keeps
# this feature out of the release builds.
sioul-sync = { path = "../sioul-sync", features = ["no-keyring", "test-store-key"] }
# The sealed store's fixed test key for the tests of `sioul store` (SIOUL_TEST_STORE_KEY).
sioul-core = { path = "../sioul-core", features = ["test-store-key"] }

[features]
# For tests against a local mail server only (see sioul-sync's feature of the same name).
insecure-test-tls = ["sioul-sync/insecure-test-tls", "sioul-learn/insecure-test-tls"]
