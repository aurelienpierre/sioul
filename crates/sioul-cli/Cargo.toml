[package]
name = "sioul-cli"
description = "Sioul from the terminal: the Porch, cases, admin windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sioul"
path = "src/main.rs"

[dependencies]
sioul-core = { path = "../sioul-core" }
sioul-sync = { path = "../sioul-sync" }
clap.workspace = true
jiff.workspace = true
rpassword.workspace = true
serde.workspace = true
# The MCP server's JSON-RPC (`sioul mcp`); the core is built with it already.
serde_json.workspace = true
toml.workspace = true

# The spam filter's training (`sioul spam`): desktops only, never on a phone.
[target.'cfg(not(target_os = "android"))'.dependencies]
sioul-learn = { path = "../sioul-learn" }

# A training runs below the other programs' priority (setpriority), as the window's does.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# For tests against a local mail server only (see sioul-sync's feature of the same name).
insecure-test-tls = ["sioul-sync/insecure-test-tls", "sioul-learn/insecure-test-tls"]
