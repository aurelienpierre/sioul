[package]
name = "sioul-sync"
description = "Sioul's background service: finding mail servers, keeping passwords, fetching mail read-only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sioul-core = { path = "../sioul-core" }
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
jiff.workspace = true
async-imap.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
ureq.workspace = true
serde_json.workspace = true
mail-auth.workspace = true
mail-send.workspace = true
roxmltree.workspace = true
# Bitwarden, read here (no external program): its key derivation, its
# encryption, its organisations' RSA keys, and one-time codes (RFC 6238).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
rsa = "0.9"
zeroize = "1"
# The sharing memory's part in files.json hashed, not serialized, to tell
# whether it changed (share.rs, `sealed_digest_now`): XXH3, in the lock already (Sequoia's).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Only to cap the level of what crates log, at the start of each program: a
# security key's PIN goes through `openpgp-card`, which traces whole APDUs.
log = "0.4"
subtle = "2"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
ciborium = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Notes and papers compressed before they are sealed into the sharing folder
# (gzip, pure Rust: already built for zip and OpenPGP).
flate2 = "1"
# Names of notes compared as a phone's storage sees them (one composition,
# NFC): already built for mail-auth's domain names.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

# Extensions (extensions/engine.rs, docs/extensions.md): their WebAssembly
# files run by wasmi, an interpreter in pure Rust (MIT or Apache-2.0): no
# code made at run time, so the same on Linux, in the Flatpak, on Windows,
# macOS and Android; fuel and memory limits. `validate` checks a module before
# it runs; no WAT, no SIMD's text. `auto-dispatch`, the one default feature
# kept: wasmi passes from one instruction's handler to the next by a jump
# only where the build makes it one (optimised, without debug assertions:
# a release), and runs a loop elsewhere. Without it a debug build calls each
# handler from the one before, and a module's long stretch overflows its
# thread's stack.
wasmi = { version = "2.0.1", default-features = false, features = ["std", "validate", "auto-dispatch"] }

# Security keys (OpenPGP cards: a YubiKey, a Nitrokey) on every device: the
# card protocol, the backend traits its transports implement, and the PIN as
# the protocol takes it (securitykey/ocard.rs); the phone's transport is
# Sioul's own (securitykey/phone.rs). Pinned: openpgp-card moved from 0.5 to
# 0.7 in two years (docs/client.md, "Your keys on a security key").
openpgp-card = "=0.7.0"
card-backend = "=0.2.0"
secrecy = "=0.10.3"

# The room left on the disk, before fetching older mail.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

# Notifications through Windows' and macOS' own; Linux and the BSDs send theirs over D-Bus
# themselves (notify.rs, bus.rs); none on Android yet.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
notify-rust.workspace = true
# Certificates checked by the system's own verifier, for receiving, sending
# and discovery's checks alike (imap.rs, `tls_config`): revocation, the
# system's distrust, roots fetched on demand, missing intermediates. The
# version mail-send brings already (Cargo.lock: 0.7.1), no feature of its own.
rustls-platform-verifier = "0.7"
[target.'cfg(not(target_os = "android"))'.dependencies]
# A computer reaches the key through the system's smart card service, PC/SC
# (securitykey/smartcard.rs): its transport, and PC/SC itself for its typed
# errors (a key held by GnuPG).
card-backend-pcsc = "=0.5.2"
pcsc = "=2.9.0"

# Each system's own keyring: the Secret Service (KWallet, GNOME Keyring), the
# Windows Credential Manager, the macOS Keychain, Android's KeyStore.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
# Through zbus (`async-secret-service`, its blocking calls on zbus's own
# executor), never libdbus: a call the session bus does not answer is given up
# after its time limit (secret.rs, `limited`), and a thread left waiting holds
# none of libdbus's locks that Sioul's other D-Bus connections take (decided
# on 26 November 2026).
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }
# Every D-Bus connection (bus.rs: never libdbus's own registration): the notifications
# (notify.rs), the desktop's do-not-disturb (dnd.rs), the system's reading (power.rs), colord.
dbus = "0.9"
# The keyring's own Secret Service library, for reads through one session kept
# for the process (secret.rs, `kept`): the same version, encryption and zbus,
# where the keyring crate keeps passwords in the Secret Service (Linux, FreeBSD,
# OpenBSD; elsewhere among the Unixes it keeps none).
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "4", default-features = false, features = ["async-io"] }
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# The antivirus's doors (antivirus_windows.rs): AMSI and the Security
# Center's health looked up when asked (LibraryLoader), never linked, so that
# a Windows without them still starts Sioul; the attachment service and the
# Security Center's list by COM; AMSI's enrolled antivirus in the registry.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SecurityCenter", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# Android: the KeyStore keeps a key, the app's private storage what it encrypts
# (android-keyring, through Java); Java reached with what the app lends at start.
[target.'cfg(target_os = "android")'.dependencies]
keyring.workspace = true
android-keyring = { version = "0.2", default-features = false, features = ["ndk-context"] }
ndk-context = "0.1"
# The keyring's file read again when another process changed it (android.rs, `keyring_fresh`): android-keyring's own version.
jni = "0.21"

[dev-dependencies]
# The engine's tests write their small modules in WebAssembly's text form (extensions/tests.rs).
wat = "1"
# Your addresses for one test's thread alone (`agenda::own_addresses_here`): a meeting you organize, its deletion refused (dav.rs).
sioul-core = { path = "../sioul-core", features = ["test-hooks"] }
# The phone's backend tested against a stand-in card (securitykey/phone_tests.rs).
sequoia-openpgp.workspace = true
# X25519 lent to the stand-in card's Curve25519 key (phone_tests.rs): in the lock already (Sequoia's RustCrypto side).
x25519-dalek = "=2.0.1"

[features]
# Accepts any server certificate when SIOUL_TEST_INSECURE_TLS is set: for tests
# against a local server only. Never enabled in Sioul's builds.
insecure-test-tls = []
# The tests of the crates built on this one (their [dev-dependencies] turn it
# on): every function of `secret` reads no entry and keeps nothing, so that no
# test reaches a keyring, whatever bus it runs on (review of 19 October 2026,
# F11). Never enabled in Sioul's builds: `cargo tree -e features` shows it in
# test builds alone.
no-keyring = []
# The sealed store's fixed test key: with SIOUL_TEST_STORE_KEY set, `storekey`
# gives it and reaches no keyring. For tests and the demo only; never in
# Sioul's builds (its mark, SIOUL_TEST_STORE_KEY, is refused by
# tools/check-test-marks.sh).
test-store-key = ["sioul-core/test-store-key"]
