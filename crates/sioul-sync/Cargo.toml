[package]
name = "sioul-sync"
description = "Sioul's background service: finding mail servers, keeping passwords, fetching mail read-only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sioul-core = { path = "../sioul-core" }
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
jiff.workspace = true
async-imap.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
ureq.workspace = true
serde_json.workspace = true
mail-auth.workspace = true
mail-send.workspace = true
roxmltree.workspace = true
# Bitwarden, read here (no external program): its key derivation, its
# encryption, its organisations' RSA keys, and one-time codes (RFC 6238).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
rsa = "0.9"
zeroize = "1"
subtle = "2"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
ciborium = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Notes and papers compressed before they are sealed into the sharing folder
# (gzip, pure Rust: already built for zip and OpenPGP).
flate2 = "1"
# Names of notes compared as a phone's storage sees them (one composition,
# NFC): already built for mail-auth's domain names.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

# The room left on the disk, before fetching older mail.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

# Notifications through the system's own (D-Bus, Windows, macOS); none on Android yet.
[target.'cfg(not(target_os = "android"))'.dependencies]
notify-rust.workspace = true

# Each system's own keyring: the Secret Service (KWallet, GNOME Keyring), the
# Windows Credential Manager, the macOS Keychain, Android's KeyStore.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }
# The notification of the time running (notify.rs): changed in place, its buttons
# pressed any number of times, heard on the connection that showed it.
dbus = "0.9"
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_System_Antimalware", "Win32_Foundation", "Win32_Storage_FileSystem"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# Android: the KeyStore keeps a key, the app's private storage what it encrypts
# (android-keyring, through Java); Java reached with what the app lends at start.
[target.'cfg(target_os = "android")'.dependencies]
keyring.workspace = true
android-keyring = { version = "0.2", default-features = false, features = ["ndk-context"] }
ndk-context = "0.1"

[features]
# Accepts any server certificate when SIOUL_TEST_INSECURE_TLS is set: for tests
# against a local server only. Never enabled in Sioul's builds.
insecure-test-tls = []
