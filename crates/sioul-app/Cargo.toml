[package]
name = "sioul-app"
description = "Sioul's window: the Porch, budgets and accounts, in Qt Quick."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sioul-app"
path = "src/main.rs"

[dependencies]
sioul-core = { path = "../sioul-core" }
sioul-sync = { path = "../sioul-sync" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[features]
# For tests against a local mail server only (see sioul-sync's feature of the same name).
insecure-test-tls = ["sioul-sync/insecure-test-tls"]
