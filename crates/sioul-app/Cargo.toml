[package]
name = "sioul-app"
description = "Sioul's window: the Porch, budgets and accounts, in Qt Quick."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# The window is a library: the desktop program below runs it, and so does
# Android's, which Qt for Android builds around it with CMake (android/).
[lib]
name = "sioul_app"
path = "src/lib.rs"

[[bin]]
name = "sioul-app"
path = "src/main.rs"

[dependencies]
sioul-core = { path = "../sioul-core" }
sioul-sync = { path = "../sioul-sync" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true

# The spam filter's training ("Train now" in the mail settings): desktops only;
# the phone reads the table it makes, never trains (android/CMakeLists.txt builds sioul-app alone).
[target.'cfg(not(target_os = "android"))'.dependencies]
sioul-learn = { path = "../sioul-learn" }

# The training's thread below the window's, on Linux (each thread its own priority there).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cxx-qt-build.workspace = true
# The Windows program's icon and details (Explorer's properties); used only when building for Windows.
winresource = { version = "0.1.31", default-features = false }

[features]
# For tests against a local mail server only (see sioul-sync's feature of the same name).
insecure-test-tls = ["sioul-sync/insecure-test-tls", "sioul-learn/insecure-test-tls"]
